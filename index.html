<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0f14">
<title>Protocolli PDV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@500&family=DM+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0d0f14; --card:#161a22; --line:#232936; --input:#0d0f14; --inline:#2a3140;
    --gold:#e8b84b; --gold2:#c9971f; --gold3:#b8860b;
    --txt:#f2f2f2; --muted:#8a93a6; --red:#e5484d;
    --grad:linear-gradient(135deg,#e8b84b 0%,#c9971f 55%,#b8860b 100%);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--txt);font-family:'DM Sans',system-ui,-apple-system,sans-serif}
  body{padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
  .wrap{max-width:560px;margin:0 auto;padding:16px 14px 120px}

  .home{display:block;width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--card);
        color:var(--gold);font-weight:800;font-size:16px;text-align:center;text-decoration:none;margin-bottom:16px}

  header{text-align:center;margin:6px 0 18px}
  header h1{margin:0;font-size:28px;font-weight:800;letter-spacing:.5px}
  header h1 span{color:var(--gold)}
  header .date{color:var(--muted);font-family:'DM Mono',monospace;font-size:14px;margin-top:4px}

  .card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;overflow:hidden}
  .card::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--grad)}

  label.lbl{display:block;font-weight:600;color:var(--muted);font-size:13px;margin-bottom:6px}
  select,input[type=text]{width:100%;padding:13px;border-radius:10px;border:1px solid var(--inline);background:var(--input);
        color:var(--txt);font-size:17px;font-family:inherit;outline:none}
  select:focus,input:focus{border-color:var(--gold)}

  .total{display:flex;align-items:center;justify-content:space-between}
  .total .t-lbl{font-size:15px;color:var(--muted);font-weight:600}
  .total .t-num{font-family:'DM Mono',monospace;font-size:46px;color:var(--gold);line-height:1}

  .list{display:flex;flex-direction:column;gap:10px}
  .row{display:grid;grid-template-columns:auto 1fr auto auto auto;align-items:center;gap:10px;background:var(--card);
       border:1px solid var(--line);border-radius:14px;padding:10px 10px 10px 14px}
  .row.top{border-color:var(--gold3)}
  .name{font-weight:800;font-size:17px;line-height:1.15;word-break:break-word}
  .name small{display:block;font-weight:400;color:var(--muted);font-size:12px;font-family:'DM Mono',monospace;margin-top:3px}
  .count{font-family:'DM Mono',monospace;font-size:30px;min-width:52px;text-align:center;color:var(--txt);line-height:1}
  .count small{display:block;font-size:11px;color:var(--gold);margin-top:5px;font-family:'DM Sans',sans-serif;font-weight:600;white-space:nowrap}
  .x{background:transparent;border:1px solid var(--inline);color:var(--muted);border-radius:7px;padding:2px 7px;font-size:12px;margin-left:6px;cursor:pointer;vertical-align:2px}
  .rest{display:flex;flex-direction:column;gap:5px}
  .st{width:58px;padding:6px 0;border-radius:8px;border:1px solid var(--inline);background:transparent;color:var(--muted);
      font-size:11px;font-weight:800;cursor:pointer;font-family:inherit;letter-spacing:.3px}
  .st.on{background:var(--grad);color:#14110a;border-color:transparent}
  .row.off .rest{opacity:1}
  .row.off > :not(.rest){opacity:.4}
  .row.off .plus,.row.off .minus{pointer-events:none;filter:grayscale(1)}
  .row.off .name small{color:var(--gold)}
  .grid3{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
  .btn-tg{background:#229ED9;color:#fff}
  .minus{width:40px;height:52px;border-radius:10px;border:1px solid var(--inline);background:transparent;color:var(--muted);
         font-size:22px;font-weight:800;cursor:pointer}
  .plus{width:76px;height:60px;border-radius:12px;border:none;background:var(--grad);color:#14110a;
        font-size:24px;font-weight:800;cursor:pointer;font-family:'DM Sans',sans-serif}
  .plus:active{transform:scale(.94)}
  .row.flash{animation:flash .45s ease}
  @keyframes flash{0%{background:#3a2f12}100%{background:var(--card)}}

  .empty{color:var(--muted);text-align:center;padding:18px 6px;line-height:1.5}

  .btn{display:block;width:100%;padding:15px;border-radius:12px;border:none;font-size:16px;font-weight:800;cursor:pointer;font-family:inherit}
  .btn-gold{background:var(--grad);color:#14110a}
  .btn-ghost{background:transparent;color:var(--txt);border:1px solid var(--inline)}
  .btn-red{background:transparent;color:var(--red);border:1px solid #4a2326}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}

  details.manage summary{cursor:pointer;color:var(--gold);font-weight:800;list-style:none;font-size:16px}
  details.manage summary::-webkit-details-marker{display:none}
  .m-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)}
  .m-row button{background:transparent;border:1px solid #4a2326;color:var(--red);border-radius:8px;padding:6px 10px;font-weight:600;cursor:pointer}
  .add-line{display:flex;gap:8px;margin-top:12px}
  .add-line button{flex:0 0 auto;padding:0 18px;border-radius:10px;border:none;background:var(--grad);color:#14110a;font-weight:800;font-size:15px;cursor:pointer}

  .toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0));transform:translateX(-50%);background:#1d222c;
         border:1px solid var(--gold3);color:var(--txt);padding:12px 18px;border-radius:12px;font-weight:600;opacity:0;
         transition:opacity .2s;pointer-events:none;max-width:90%;text-align:center;z-index:9}
  .toast.on{opacity:1}
  button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  @media (prefers-reduced-motion:reduce){.row.flash{animation:none}.plus:active{transform:none}}
</style>
</head>
<body>
<div class="wrap">

  <a class="home" href="#" onclick="history.back();return false;">← Torna alla Home Hub</a>

  <header>
    <h1>PROTOCOLLI <span>PDV</span></h1>
    <div class="date" id="today"></div>
  </header>

  <div class="card">
    <label class="lbl" for="pdv">Punto vendita</label>
    <select id="pdv">
      <option value="">— Seleziona punto vendita —</option>
      <option>FANO</option><option>MONSANO</option><option>OSIMO</option>
      <option>MACERATA</option><option>CIVITANOVA</option><option>PESARO</option>
    </select>
  </div>

  <div class="grid3" style="margin:0 0 14px">
    <div class="card total" style="margin:0;flex-direction:column;align-items:flex-start;gap:8px">
      <div class="t-lbl">Totale oggi</div>
      <div class="t-num" id="total">0</div>
    </div>
    <div class="card total" style="margin:0;flex-direction:column;align-items:flex-start;gap:8px">
      <div class="t-lbl" id="monthLbl">Totale mese</div>
      <div class="t-num" id="totalMonth">0</div>
    </div>
  </div>

  <div class="list" id="list"></div>

  <button class="btn btn-ghost" id="undoBtn" style="margin-top:12px">↩︎ Annulla ultimo</button>
  <div class="grid2">
    <button class="btn btn-gold" id="sendBtn">📧 Invia mail</button>
    <button class="btn btn-tg" id="tgBtn">✈️ Telegram</button>
  </div>

  <div class="card" style="margin-top:14px">
    <details class="manage" id="manage">
      <summary>⚙️ Gestisci addetti</summary>
      <div id="mList" style="margin-top:10px"></div>
      <div class="add-line">
        <input type="text" id="newName" placeholder="Nome e cognome addetto">
        <button id="addBtn">Aggiungi</button>
      </div>
      <button class="btn btn-ghost" id="restoreBtn" style="margin-top:12px">↺ Ripristina lista originale</button>
    </details>
  </div>

  <div class="grid2">
    <button class="btn btn-red" id="resetBtn">🗑️ Azzera oggi</button>
    <button class="btn btn-red" id="resetMonthBtn">🗑️ Azzera mese</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* =====================================================
   ADDETTI PRECARICATI PER PUNTO VENDITA
   Da export venduto collaboratori 01-12/11/2026.
   Aggiornamento mensile: sostituire solo questo elenco.
   Le modifiche dei direttori (✕ e aggiunte) restano valide.
   Il direttore può togliere (✕) cassiere/magazzino o aggiungere
   nomi dall'app; "Ripristina lista originale" torna a questo elenco.
   ===================================================== */
const ADDETTI = {
  FANO:       ["BETTI VALENTINA", "CANNELLA LORENZO", "CIUFFO MATTIA", "CIULLO LORIS", "DONNO CLAUDIA", "FOGLINO ALESSANDRA CRISTIANA", "GIACCHETTI MARINA", "LAMBIASE SIMONE", "MAGI LUCA", "MENCARELLI ANDREA", "MEOZZI ROBERTO", "NARDINI ANDREA", "POLA ILARIA", "TONELLI SARA", "VINCENTI MATTEO", "ZENOBI ANTONELLO"],
  MONSANO:    ["ALBORINI GIACOMO", "BELEMMI DAVIDE", "CASTAGNA GIULIA", "CECCONI JESSICA", "CHIACCHIARI CAMILLO", "CICINELLI FABIO", "CORRADINI VALENTINA", "DONNINI FEDERICO", "MAGGIORI RICCARDO", "MAZZOLINI SAMUELE", "MOSCHINI FRANCESCO", "PASQUALINI ALESSANDRO", "RICCARDI ROSANNA", "RIZVANI AIDA", "SALANDRA MARCO", "SEBASTIANELLI BEATRICE", "URBANI DILETTA", "ZUCCARO AZZURRA"],
  OSIMO:      ["AGOSTINELLI ALICE", "BENEDETTI ALESSIO", "BINCI GIANLUCA", "BUGLIONI LORIS", "CAGNAZZO MATTIA", "DOMENELLA PAOLO", "DOMESI GIACOMO", "FATIGA SONIA", "FRONTALINI FABIANO", "GALVANO SILVIA", "GUAGLIARDITO GIUSEPPE", "LILLINI CRISTINA", "MOSCHINI FRANCESCO", "NICOLINI DANIELE", "PAPA SIGLINDE", "RAVARELLI ALICE", "ROSELLINI EMANUELE", "ROSSI ROBERTO", "TIBERI CRISTIAN", "ZOCCHI BARBARA"],
  MACERATA:   ["ANDRENACCI EMANUELE", "ANGELETTI FRANCESCA", "ASCANI MASSIMILIANO", "CAPOMAGI MARGHERITA", "CARBONARI ANDREA", "COLASANTE ROSANNA", "FORMENTINI ERIKA", "LUCHETTA LAURA", "MANZI YURI", "MARAVIGLIA MAURIZIO", "MESCHINI DANIELE", "PALMARUCCI DANILO", "PERRONE FABIO ETTORE VINCENZO", "PORCARO MARCO"],
  CIVITANOVA: ["APPIGNANESI ANIMENTO ELISA", "BELLEGGIA DIEGO", "BRUNI ALESSANDRO", "CRUCIANI MARCO", "EJUPI FLUTRA", "FELACE MATTIA", "FERRACUTI MARCO", "LATINI STEFANO", "PACCAMICCIO ANDREA", "PALLOTTI FEDERICA", "RIPA RICCARDO", "SILVESTRINI MAICOL", "SIMONELLI ALESSIA", "TRAINI SONIA", "TRONO ENZO", "URBANI FRANCESCO", "ZAMPALONI ANDREA"],
  PESARO:     ["CIARDO MARIA FILOMENA", "COCCOLI VALENTINA", "FAVALE TIZIANA", "FRANCHINI LUCA", "GERACI STEPHAN", "LEONARDI MATTIA", "MAGRINI ROBERTA", "MARINONI MONICA", "MAZZANTI NICOLA", "MIDOLO ANDREA", "PARRUCCI EMANUELE", "PAZZAGLIA PAOLO", "POLLANI PAOLO", "SARTINI SIMONE", "SCAVONE SIMONE", "SEBENICO ALEX", "TABONI RICCARDO", "TURTÙ FRANCESCO", "UGUCCIONI CHIARA", "ZEPPETELLA ANDREA"]
};
const EMAIL_TO = "d.pavoni@dml-italia.com";

/* ---------- storage sicuro ---------- */
const mem = {};
const store = {
  get(k){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; }catch(e){ return mem[k] ?? null; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){ mem[k] = v; } },
  del(k){ try{ localStorage.removeItem(k); }catch(e){ delete mem[k]; } }
};

const now = new Date();
const pad = x => String(x).padStart(2,'0');
const todayKey = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
const monthKey = todayKey.slice(0,7);
const todayIT  = now.toLocaleDateString('it-IT',{weekday:'long',day:'2-digit',month:'2-digit',year:'numeric'});
const monthIT  = now.toLocaleDateString('it-IT',{month:'long'});
document.getElementById('today').textContent = todayIT;
document.getElementById('monthLbl').textContent = 'Totale ' + monthIT;

const $pdv = document.getElementById('pdv');
let pdv = store.get('prot_pdv') || '';
let staff = [];   // nomi addetti del PDV
let events = [];  // protocolli del mese: [{n:nome, d:'AAAA-MM-GG', t:timestamp}]
let riposo = [];  // addetti a riposo oggi
let ferie  = [];  // addetti in ferie (resta finché non si toglie)

const custKey   = () => 'prot_custom_' + pdv;   // modifiche del direttore: {removed:[], added:[]}
let cust = {removed:[], added:[]};
function buildStaff(){
  const base = ADDETTI[pdv] || [];
  staff = base.filter(n => !cust.removed.includes(n));
  cust.added.forEach(n => { if(!staff.includes(n)) staff.push(n); });
}
const monthSKey = () => 'prot_month_' + pdv;
const restKey   = () => 'prot_riposo_' + pdv;
const ferieKey  = () => 'prot_ferie_' + pdv;

function loadPdv(){
  if(!pdv){ staff=[]; events=[]; riposo=[]; ferie=[]; render(); return; }
  cust = store.get(custKey());
  if(!cust){
    cust = {removed:[], added:[]};
    const old = store.get('prot_staff_v2_' + pdv);   // migrazione versione precedente
    if(old){
      const base = ADDETTI[pdv] || [];
      cust.removed = base.filter(n => !old.includes(n));
      cust.added   = old.filter(n => !base.includes(n));
    }
    saveStaff();
  }
  buildStaff();

  const m = store.get(monthSKey());
  if(m && m.month === monthKey){ events = m.events || []; }
  else {
    if(m && m.events && m.events.length) toast('Nuovo mese: totali ripartiti da zero');
    events = [];
    // recupero dati della versione precedente (solo oggi)
    const old = store.get('prot_day_' + pdv);
    if(old && old.date === todayKey && old.events) events = old.events.map(e => ({n:e.n, d:todayKey, t:e.t}));
    saveMonth();
  }
  const r = store.get(restKey());
  riposo = (r && r.date === todayKey) ? (r.list || []) : [];
  ferie = store.get(ferieKey()) || [];
  render();
}
function saveMonth(){ if(pdv) store.set(monthSKey(), {month:monthKey, events}); }
function saveStaff(){ if(pdv) store.set(custKey(), cust); }
function saveRest(){ if(pdv){ store.set(restKey(), {date:todayKey, list:riposo}); store.set(ferieKey(), ferie); } }
const isOff = n => riposo.includes(n) || ferie.includes(n);

const todayEvents = () => events.filter(e => e.d === todayKey);
function countsOf(list){
  const c = {}; staff.forEach(n => c[n] = 0);
  list.forEach(e => { c[e.n] = (c[e.n] || 0) + 1; });
  return c;
}
function lastTime(n){
  for(let i=events.length-1;i>=0;i--) if(events[i].n===n && events[i].d===todayKey)
    return new Date(events[i].t).toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});
  return null;
}
const esc = s => String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

function render(){
  const list = document.getElementById('list');
  const tEv = todayEvents();
  const cD = countsOf(tEv), cM = countsOf(events);
  const max = Math.max(0, ...Object.values(cD));
  document.getElementById('total').textContent = tEv.length;
  document.getElementById('totalMonth').textContent = events.length;

  if(!pdv){
    list.innerHTML = '<div class="card empty">Seleziona il punto vendita per vedere gli addetti.</div>';
  } else if(!staff.length){
    list.innerHTML = '<div class="card empty">Nessun addetto. Aggiungili da “Gestisci addetti”.</div>';
  } else {
    list.innerHTML = staff.map((n,i) => {
      const isR = riposo.includes(n), isF = ferie.includes(n), off = isR || isF;
      const lt = lastTime(n);
      const sub = isF ? 'IN FERIE' : isR ? 'DI RIPOSO' : (lt ? 'ultimo alle ' + lt : 'nessun protocollo oggi');
      return `<div class="row ${off?'off':''} ${!off && cD[n] && cD[n]===max ? 'top':''}" id="r${i}">
        <div class="rest">
          <button class="st ${isR?'on':''}" data-r="${i}" aria-pressed="${isR}" aria-label="${esc(n)} di riposo oggi">RIPOSO</button>
          <button class="st ${isF?'on':''}" data-f="${i}" aria-pressed="${isF}" aria-label="${esc(n)} in ferie">FERIE</button>
        </div>
        <div class="name">${esc(n)}<button class="x" data-x="${i}" aria-label="Togli ${esc(n)} dalla lista">✕</button><small>${sub}</small></div>
        <button class="minus" aria-label="Togli uno a ${esc(n)}" data-m="${i}">−</button>
        <div class="count">${cD[n] || 0}<small>mese ${cM[n] || 0}</small></div>
        <button class="plus" aria-label="Aggiungi uno a ${esc(n)}" data-p="${i}">+1</button>
      </div>`;
    }).join('');
  }
  renderManage();
}

function renderManage(){
  const m = document.getElementById('mList');
  if(!pdv){ m.innerHTML = '<div class="empty">Seleziona prima il punto vendita.</div>'; return; }
  m.innerHTML = staff.map((n,i) =>
    `<div class="m-row"><span>${esc(n)}</span><button data-del="${i}">Rimuovi</button></div>`
  ).join('') || '<div class="empty">Lista vuota.</div>';
}

/* ---------- azioni ---------- */
document.getElementById('list').addEventListener('click', e => {
  const p = e.target.closest('[data-p]'), m = e.target.closest('[data-m]'), x = e.target.closest('[data-x]');
  if(x){ removeStaff(+x.dataset.x); return; }
  if(p){
    const i = +p.dataset.p, n = staff[i];
    if(isOff(n)) return;
    events.push({n, d:todayKey, t:Date.now()}); saveMonth(); render();
    const row = document.getElementById('r'+i); if(row) row.classList.add('flash');
    if(navigator.vibrate) navigator.vibrate(30);
  }
  if(m){
    const n = staff[+m.dataset.m];
    for(let k=events.length-1;k>=0;k--) if(events[k].n===n && events[k].d===todayKey){
      events.splice(k,1); saveMonth(); render(); toast('Tolto 1 a ' + n); return;
    }
    toast('Nessun protocollo di oggi da togliere');
  }
});
document.getElementById('list').addEventListener('click', e => {
  const r = e.target.closest('[data-r]'), f = e.target.closest('[data-f]');
  if(r){
    const n = staff[+r.dataset.r], on = !riposo.includes(n);
    riposo = on ? [...riposo, n] : riposo.filter(x => x !== n);
    if(on) ferie = ferie.filter(x => x !== n);
    saveRest(); render(); toast(on ? n + ' di riposo oggi' : n + ' in servizio');
  }
  if(f){
    const n = staff[+f.dataset.f], on = !ferie.includes(n);
    ferie = on ? [...ferie, n] : ferie.filter(x => x !== n);
    if(on) riposo = riposo.filter(x => x !== n);
    saveRest(); render(); toast(on ? n + ' in ferie (fino a quando lo togli)' : n + ' rientrato dalle ferie');
  }
});

document.getElementById('undoBtn').onclick = () => {
  for(let k=events.length-1;k>=0;k--) if(events[k].d===todayKey){
    const e = events.splice(k,1)[0]; saveMonth(); render(); toast('Annullato: ' + e.n); return;
  }
  toast('Niente da annullare');
};

document.getElementById('addBtn').onclick = () => {
  if(!pdv){ toast('Seleziona il punto vendita'); return; }
  const inp = document.getElementById('newName');
  const n = inp.value.trim().toUpperCase();
  if(!n) return;
  if(staff.includes(n)){ toast('Addetto già presente'); return; }
  cust.removed = cust.removed.filter(r => r !== n);
  if(!(ADDETTI[pdv] || []).includes(n)) cust.added.push(n);
  buildStaff(); saveStaff(); inp.value=''; render(); toast('Aggiunto ' + n);
};
document.getElementById('newName').addEventListener('keydown', e => { if(e.key==='Enter') document.getElementById('addBtn').click(); });

document.getElementById('mList').addEventListener('click', e => {
  const b = e.target.closest('[data-del]'); if(!b) return;
  removeStaff(+b.dataset.del);
});
function removeStaff(i){
  const n = staff[i];
  if(!confirm('Togliere ' + n + ' dalla lista? (es. cassiera o magazzino)\nSi può riaggiungere da "Gestisci addetti".')) return;
  cust.added = cust.added.filter(a => a !== n);
  if((ADDETTI[pdv] || []).includes(n) && !cust.removed.includes(n)) cust.removed.push(n);
  buildStaff(); riposo = riposo.filter(r => r !== n); ferie = ferie.filter(r => r !== n);
  saveStaff(); saveRest(); render(); toast(n + ' tolto dalla lista');
}
document.getElementById('restoreBtn').onclick = () => {
  if(!pdv){ toast('Seleziona il punto vendita'); return; }
  if(!confirm('Ripristinare la lista originale degli addetti di ' + pdv + '?')) return;
  cust = {removed:[], added:[]}; buildStaff(); saveStaff(); render(); toast('Lista originale ripristinata');
};

document.getElementById('resetBtn').onclick = () => {
  if(!pdv) return;
  if(!confirm('Azzerare i protocolli di OGGI per ' + pdv + '? (il totale del mese perde quelli di oggi)')) return;
  events = events.filter(e => e.d !== todayKey); saveMonth(); render(); toast('Conteggi di oggi azzerati');
};

document.getElementById('resetMonthBtn').onclick = () => {
  if(!pdv) return;
  if(!confirm('Azzerare TUTTI i protocolli di ' + monthIT.toUpperCase() + ' per ' + pdv + '?\n(oggi compreso)')) return;
  if(!confirm('Sicuro? L\'operazione non si può annullare.\nConsiglio: invia prima il report.')) return;
  events = []; saveMonth(); render(); toast('Totali del mese azzerati');
};

$pdv.onchange = () => { pdv = $pdv.value; store.set('prot_pdv', pdv); loadPdv(); };

/* ---------- report ---------- */
function buildReport(){
  const tEv = todayEvents();
  const cD = countsOf(tEv), cM = countsOf(events);
  const dataIT = now.toLocaleDateString('it-IT',{weekday:'short',day:'2-digit',month:'2-digit',year:'numeric'});
  const ora = now.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});
  const att = staff.filter(n => !isOff(n)).sort((a,b) => (cD[b]-cD[a]) || (cM[b]-cM[a]) || a.localeCompare(b));
  const off = staff.filter(n => riposo.includes(n) && !ferie.includes(n));
  const fer = staff.filter(n => ferie.includes(n));
  const top = Math.max(1, ...att.map(n => cD[n] || 0));
  const SEP = '━━━━━━━━━━━━━━━━';
  const medal = ['🥇','🥈','🥉','4️⃣','5️⃣','6️⃣','7️⃣','8️⃣','9️⃣','🔟'];
  const bar = v => { const k = Math.round((v / top) * 10); return '▰'.repeat(k) + '▱'.repeat(10 - k); };

  // posizioni a pari merito (stesso numero oggi = stessa posizione)
  let pos = 0, prev = null;
  const rows = att.map((n,i) => {
    const v = cD[n] || 0;
    if(v !== prev){ pos = i; prev = v; }
    const icon = v === 0 ? '▫️' : (medal[pos] || `${pos+1}.`);
    return `${icon} ${n}  ➜  ${v}\n      ${bar(v)}   mese ${cM[n] || 0}`;
  });

  let t = `📋 PROTOCOLLI PDV\n🏬 ${pdv}\n📅 ${dataIT} · ore ${ora}\n${SEP}\n`;
  t += `🔥 OGGI: ${tEv.length} PROTOCOLLI\n${SEP}\n\n`;
  t += `🏆 CLASSIFICA DI OGGI\n\n`;
  t += rows.length ? rows.join('\n\n') : 'Nessun addetto in servizio';
  if(off.length){
    t += `\n\n${SEP}\n😴 DI RIPOSO\n`;
    off.forEach(n => { t += `• ${n}   (mese ${cM[n] || 0})\n`; });
    t = t.trimEnd();
  }
  if(fer.length){
    t += `\n\n${SEP}\n🏖️ IN FERIE\n`;
    fer.forEach(n => { t += `• ${n}   (mese ${cM[n] || 0})\n`; });
    t = t.trimEnd();
  }
  t += `\n\n${SEP}\n📊 Totale ${monthIT}: ${events.length} protocolli`;
  return {t, subject:`📋 Protocolli ${pdv} – ${now.toLocaleDateString('it-IT')} – oggi ${tEv.length}`};
}
document.getElementById('sendBtn').onclick = () => {
  if(!pdv){ alert('Seleziona il PUNTO VENDITA prima di inviare.'); return; }
  const r = buildReport();
  window.location.href = `mailto:${EMAIL_TO}?subject=${encodeURIComponent(r.subject)}&body=${encodeURIComponent(r.t)}`;
};
document.getElementById('tgBtn').onclick = async () => {
  if(!pdv){ alert('Seleziona il PUNTO VENDITA prima di inviare.'); return; }
  const r = buildReport();
  const txt = r.t;
  // copia sempre negli appunti (paracadute: basta incollare in Telegram)
  try{ await navigator.clipboard.writeText(txt); }catch(e){}
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
  if(isIOS){
    // iPhone: apre direttamente l'app Telegram con il messaggio pronto
    window.location.href = 'tg://msg?text=' + encodeURIComponent(txt);
    // se Telegram non si apre, dopo 1,5 s propone la condivisione di iOS
    setTimeout(async () => {
      if(document.visibilityState === 'visible'){
        if(navigator.share){
          try{ await navigator.share({text: txt}); return; }catch(e){ if(e.name==='AbortError') return; }
        }
        toast('Report copiato: apri Telegram e incolla');
      }
    }, 1500);
  } else {
    window.location.href = `https://t.me/share/url?url=${encodeURIComponent(' ')}&text=${encodeURIComponent(txt)}`;
  }
};

/* ---------- toast ---------- */
let tt;
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('on');
  clearTimeout(tt); tt = setTimeout(() => el.classList.remove('on'), 2200);
}

/* ---------- avvio ---------- */
$pdv.value = pdv;
loadPdv();
</script>
</body>
